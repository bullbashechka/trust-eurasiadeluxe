<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eurasia De Luxe — контрольные снимки после исправлений</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #29272e; background: #f3f0eb; font: 16px/1.55 system-ui, sans-serif; }
  header, main { width: min(100% - 32px, 1120px); margin-inline: auto; }
  header { padding-block: 42px 22px; }
  h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 52px); line-height: 1.05; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 22px; padding-bottom: 48px; }
  figure { margin: 0; padding: 14px; border-radius: 12px; background: #fff; box-shadow: 0 8px 28px #29272e12; }
  figcaption { min-height: 50px; margin-bottom: 10px; }
  img { display: block; width: 100%; height: auto; border: 1px solid #ddd7ce; }
  a { color: inherit; }
</style>
<header>
  <h1>Контрольные состояния после исправлений</h1>
  <p>Viewport 390 × 844, DPR 1, масштаб страницы 1. Скриншоты сняты на работающем локальном сайте.</p>
</header>
<main id="gallery"></main>
<script>
  const shots = [
    ['01-mobile-home', 'Главная: логотип и меню без переполнения'],
    ['02-mobile-company-menu', 'Открытое мобильное меню главной'],
    ['04-mobile-project', 'Первый экран комплекса'],
    ['05-mobile-project-menu', 'Меню комплекса с действиями'],
    ['06-mobile-project-form', 'Явное сообщение о демонстрационной форме'],
    ['07-mobile-form-checked', 'Подтверждение проверки без обещания отправки'],
    ['08-mobile-apartment-selector', 'Диалог выбора квартиры помещается в экран'],
    ['09-mobile-tour', 'Тур с доступным переходом к фотографиям'],
    ['10-mobile-photos', 'Фоторежим'],
    ['11-mobile-video-playing', 'Видео запущено, доступна пауза'],
  ];
  const gallery = document.querySelector('#gallery');
  for (const [file, caption] of shots) {
    const figure = document.createElement('figure');
    figure.innerHTML = `<figcaption>${caption}</figcaption><a href="${file}.png" target="_blank"><img src="${file}.png" alt="${caption}" loading="lazy"></a>`;
    gallery.append(figure);
  }
</script>
</html>
